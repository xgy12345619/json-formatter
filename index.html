    <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON格式化工具 - 在线JSON美化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: #2d3748;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.8;
            font-size: 14px;
        }

        .tool-area {
            padding: 30px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn-danger {
            background: #fc8181;
            color: white;
        }

        .btn-danger:hover {
            background: #f56565;
        }

        .output-section {
            background: #f7fafc;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
        }

        .output-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }

        .output {
            background: #1a202c;
            color: #68d391;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 180px;
            overflow: auto;
        }

        .error {
            color: #fc8181;
            background: #fff5f5;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
        }

        .feature {
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
            text-align: center;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature h3 {
            font-size: 14px;
            color: #2d3748;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #718096;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 JSON格式化工具</h1>
            <p>粘贴JSON数据，一键美化格式化 - 在线免费使用</p>
        </header>

        <div class="tool-area">
            <div class="input-section">
                <label>📝 输入JSON数据：</label>
                <textarea id="jsonInput" placeholder='粘贴你的JSON数据，例如：{"name":"张三","age":25,"skills":["JavaScript","Python"]}'></textarea>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="formatJSON()">✨ 格式化</button>
                <button class="btn-secondary" onclick="compressJSON()">📦 压缩</button>
                <button class="btn-secondary" onclick="copyOutput()">📋 复制结果</button>
                <button class="btn-danger" onclick="clearAll()">🗑️ 清空</button>
            </div>

            <div class="output-section">
                <label>📄 格式化结果：</label>
                <div class="output" id="jsonOutput">等待输入...</div>
            </div>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <h3>快速格式化</h3>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔍</div>
                    <h3>语法检查</h3>
                </div>
                <div class="feature">
                    <div class="feature-icon">📱</div>
                    <h3>移动端适配</h3>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔒</div>
                    <h3>本地处理</h3>
                </div>
            </div>
        </div>

        <footer>
            <p>💡 数据仅在本地处理，不会上传到任何服务器 | 免费开源工具</p>
        </footer>
    </div>

    <script>
        function formatJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            const output = document.getElementById('jsonOutput');

            if (!input) {
                output.textContent = '⚠️ 请输入JSON数据';
                output.classList.add('error');
                return;
            }

            try {
                const parsed = JSON.parse(input);
                const formatted = JSON.stringify(parsed, null, 2);
                output.textContent = formatted;
                output.classList.remove('error');
            } catch (e) {
                output.textContent = '❌ JSON格式错误：' + e.message;
                output.classList.add('error');
            }
        }

        function compressJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            const output = document.getElementById('jsonOutput');

            if (!input) {
                output.textContent = '⚠️ 请输入JSON数据';
                output.classList.add('error');
                return;
            }

            try {
                const parsed = JSON.parse(input);
                const compressed = JSON.stringify(parsed);
                output.textContent = compressed;
                output.classList.remove('error');
            } catch (e) {
                output.textContent = '❌ JSON格式错误：' + e.message;
                output.classList.add('error');
            }
        }

        function copyOutput() {
            const output = document.getElementById('jsonOutput');
            const text = output.textContent;

            if (text && !text.startsWith('⚠️') && !text.startsWith('❌')) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('✅ 已复制到剪贴板！');
                });
            }
        }

        function clearAll() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutput').textContent = '等待输入...';
            document.getElementById('jsonOutput').classList.remove('error');
        }
    </script>
</body>
</html>
